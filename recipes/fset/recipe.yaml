package:
  name: fset
  version: "2.5.0"

source:
  git: https://github.com/slburson/fset
  rev: 1af9d2084d94457a2be39d8a6017f760a622c37c
  submodules: false

build:
  noarch: generic
  script: build.sh

requirements:
  run:
    - sbcl
    - cl-asdf
    - misc-extensions
    - mt19937
    - named-readtables

tests:
  - script:
      - sbcl --no-userinit --non-interactive
          --eval '(require :asdf)'
          --eval '(asdf:load-system "fset")'
          --eval '(asdf:test-system "fset")'

about:
  repository: https://github.com/slburson/fset
  homepage: <homepage>
  license: <license>
  summary: <summary>
  description: |
    <No description provided.>
