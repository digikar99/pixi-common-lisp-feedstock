package:
  name: cl-ansi-text
  version: "2.0.1.2025.09.13"

source:
  git: https://github.com/pnathan/cl-ansi-text
  rev: 406e12c37d07aff3bc75f66900db30bf38d60af4
  submodules: false

build:
  noarch: generic
  script: build.sh

requirements:
  run:
    - sbcl
    - cl-asdf
    - cl-colors2

tests:
  - script:
      - sbcl --no-userinit --non-interactive
          --eval '(require :asdf)'
          --eval '(asdf:load-system "cl-ansi-text.test")'
          --eval '(handler-case (5am:run! :cl-ansi-text)
                    (serious-condition (c)
                      (describe c)
                      (uiop:quit 2)))'
    requirements:
      run:
        - alexandria
        - fiveam

about:
  repository: https://github.com/pnathan/cl-ansi-text
  documentation: https://github.com/pnathan/cl-ansi-text/blob/main/README.md
  license: LicenseRef-LLGPL
  license_file: LICENSE
  summary: Enables ANSI colors for printing in the terminal with Common Lisp.
  description: |
    Because color in your terminal is nice.

    The main macro is `with-color`, which creates an enviroment where everything that is put on `stream` gets colored according to color.

    Color options comes in several forms.

    See [the documentation](https://github.com/pnathan/cl-ansi-text/blob/main/README.md) for more information.
